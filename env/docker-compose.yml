services:
  project_template: # TODO: Your project's name
    image: demo_container:latest # TODO: Your image's name
    runtime: nvidia
    container_name: ct_demo # TODO: Your container's name
    environment:
      - NVIDIA_VISIBLE_DEVICES=all  # Use all GPUs
    volumes:
      - /newdata/workspace_kaisheng:/workspace  # TODO: Map working directory
    ports:
      - "18888:8888"  # Map host port 18888 to container port 8888 for jupyter notebooks
    stdin_open: true
    tty: true
    ipc: host  # Share IPC namespace with host for large shared memory

